name: PR40 M5+M15 MultiAsset H1 portfolio, shared-risk and readiness

on:
  push:
    branches:
      - codex/m5-m15-multiasset-pr40
    paths:
      - research/triggers/pr40-multiasset-v1.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr40-multiasset-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  readiness:
    name: Verify no Q3, run unit tests and detect missing native major-pair data
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.data.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned code dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Run synthetic contract invariants; no synthetic data used for portfolio claims
        run: |
          python -m pytest -q tests/test_m5_multiasset_portfolio.py tests/test_m5_dynamic_upstream.py tests/test_m5_m15_target_experiments.py
      - name: Check signed native M5+M15 asset inventory and fail closed
        id: data
        run: |
          python -m scripts.check_pr40_data_readiness
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr40-data-readiness-and-blockers
          path: reports/pr40-multiasset/readiness.json
          if-no-files-found: warn
          retention-days: 90

  portfolio:
    name: Shared portfolio, PR38 frozen seed ${{ matrix.seed }}, EUR GBP AUD CAD
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install original fixed runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Download original EURUSD SHA-pinned H1 GARCH and complete M5+M15 universe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/download_m5_release.sh reports/m5-is-canonical
          mkdir -p reports/m5-upstream-is
          gh release download data-m5-m15-is-2026h1-full-universe-v2 \
            --repo "$GITHUB_REPOSITORY" --pattern universe.npz \
            --pattern manifest.json --dir reports/m5-upstream-is --clobber
          python -m scripts.build_m5_full_is_universe --verify-only \
            --golden reports/m5-is-canonical/a.npz \
            --golden-manifest reports/m5-is-canonical/a.json
      - name: Retrieve PR38 ORIGINAL GARCH=0% seed genome, no PR39 tuning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/pr38-founder
          gh run download 42551086458 --repo "$GITHUB_REPOSITORY" \
            --name "pr38-phase3-garch_regime-seed-${{ matrix.seed }}" \
            --dir reports/pr38-founder
          test -s "reports/pr38-founder/garch_regime-seed-${{ matrix.seed }}.json"
      - name: Fetch independently pinned symbol releases, each restricted to H1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/asset_list.tsv"
          import json
          from pathlib import Path
          d=json.loads(Path("datasets/multiasset/pr40_asset_inventory.json").read_text())
          for symbol in ("GBPUSD","AUDUSD","USDCAD"):
              asset=d["assets"][symbol]
              assert asset["status"]=="verified"
              print(symbol+"\t"+asset["release_tag"])
          PY
          while IFS="$(printf '\t')" read -r SYMBOL TAG; do
            mkdir -p "reports/pr40-assets/$(echo "$SYMBOL" | tr '[:upper:]' '[:lower:]')"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern universe.npz --pattern manifest.json \
              --dir "reports/pr40-assets/$(echo "$SYMBOL" | tr '[:upper:]' '[:lower:]')" \
              --clobber
          done < "$RUNNER_TEMP/asset_list.tsv"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Recover original March EURUSD founder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Verify 4 model lineages, calculate per-symbol frozen p85, replay shared account
        run: |
          python -m scripts.run_m5_multiasset_pr40 \
            --seed ${{ matrix.seed }} \
            --founder-report "reports/pr38-founder/garch_regime-seed-${{ matrix.seed }}.json" \
            --original-universe reports/m5-upstream-is/universe.npz \
            --original-manifest reports/m5-upstream-is/manifest.json \
            --golden reports/m5-is-canonical/a.npz \
            --golden-manifest reports/m5-is-canonical/a.json \
            --new-assets reports/pr40-assets \
            --inventory datasets/multiasset/pr40_asset_inventory.json
      - name: Document portfolio risk and prohibit Q3/automatic promotion
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          seed=int(os.environ["SEED"])
          d=json.loads(Path(f"reports/pr40-multiasset/portfolio-seed-{seed}.json").read_text())
          assert d["seed"]==seed and d["q3_accessed"] is False
          assert d["no_model_promotion"] and d["no_retraining"]
          assert list(d["portfolio_shared_account"]["symbols"])==["EURUSD","GBPUSD","AUDUSD","USDCAD"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write(f"## Frozen PR38/seed{seed}: one portfolio of 4 pairs\n\n")
              for pair,x in d["standalone_individual_accounts"].items():
                  f.write(f"{pair} standalone: PF Q1/Q2 {x['pf_q1']}/{x['pf_q2']}; "
                          f"{x['executed_contracts_per_hour']:.3f}/h; DD {x['dd_semester_pct']:.2f}%\n\n")
              x=d["portfolio_compact"]
              f.write(f"SHARED portfolio: PF Q1/Q2 {x['pf_q1']}/{x['pf_q2']}; "
                      f"{x['executed_contracts_per_hour']:.3f}/h; "
                      f"DD {x['dd_semester_pct']:.2f}%; accepted={d['portfolio_qualified']}\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr40-four-pair-portfolio-seed-${{ matrix.seed }}
          path: reports/pr40-multiasset/portfolio-seed-*.json
          if-no-files-found: warn
          retention-days: 90

  portfolio_summary:
    name: Cross-seed PF Q1/Q2, global DD and executed capacity verdict
    needs: portfolio
    if: needs.portfolio.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pr40-four-pair-portfolio-seed-*
          path: reports/seed-results
      - name: Verify 3 true H1 portfolios before reporting success
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          files=sorted(Path("reports/seed-results").rglob("portfolio-seed-*.json"))
          studies=[json.loads(p.read_text()) for p in files]
          assert sorted(x["seed"] for x in studies)==[42,43,44]
          assert all(x["q3_accessed"] is False and x["no_retraining"] for x in studies)
          assert len({tuple(sorted(x["universe_sha256_by_symbol"].items())) for x in studies})==1
          results=[]
          for x in studies:
              p=x["portfolio_compact"]
              results.append(dict(seed=x["seed"],pf_q1=p["pf_q1"],pf_q2=p["pf_q2"],
                  executed_h=p["executed_contracts_per_hour"],
                  dd_h1=p["dd_semester_pct"],qualifies=x["portfolio_qualified"],
                  per_symbol=x["standalone_individual_accounts"],
                  contribution=x["portfolio_shared_account"]["semester"]["contributions"]))
          ok=all(x["qualifies"] for x in results)
          d=dict(protocol="PR40_M5_M15_four_pair_portfolio_H1_v1",
                 seeds=[42,43,44],symbols=["EURUSD","GBPUSD","AUDUSD","USDCAD"],
                 q3_accessed=False,signal_timeframes=["M5","M15"],
                 three_seeds_qualified=ok,any_model_promoted=False,results=results)
          target=Path("reports/pr40-portfolio-summary.json")
          target.write_text(json.dumps(d,indent=2,allow_nan=False)+"\n")
          print("PR40_PORTFOLIO_FINAL "+json.dumps(d,allow_nan=False),flush=True)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("## PR40: shared account four-symbol H1, 3 seeds\n\n")
              for x in results:
                  f.write(f"Seed{x['seed']}: PF Q1/Q2 {x['pf_q1']}/{x['pf_q2']}, "
                          f"{x['executed_h']:.3f}/h executed, DD {x['dd_h1']:.2f}%, "
                          f"qualified={x['qualifies']}\n\n")
              f.write(f"Three seeds jointly qualify: {ok}. Q3 untouched.\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pr40-four-pair-portfolio-summary
          path: reports/pr40-portfolio-summary.json
          if-no-files-found: error
          retention-days: 90
