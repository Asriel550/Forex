name: PR41 20 independent generations per FX asset, M5+M15 H1 only

on:
  push:
    branches:
      - codex/m5-m15-per-asset-garch-20gen-pr41
    paths:
      - research/triggers/pr41-native-gen20-v*.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr41-independent-gen20-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  evolution:
    name: Independent ${{ matrix.symbol }} / seed ${{ matrix.seed }} / 20x128
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        symbol: [EURUSD, GBPUSD, AUDUSD, USDCAD]
        seed: [42, 43, 44]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked research runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Test independence, no lookahead, and strict PF/DD acceptance
        run: |
          python -m pytest -q tests/test_pr41_native_asset_evolution.py tests/test_m5_dynamic_upstream.py tests/test_pr40_garch_universe.py
      - name: Download original signed EURUSD M5+M15 and GARCH contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/download_m5_release.sh reports/m5-is-canonical
          mkdir -p reports/m5-upstream-is
          gh release download data-m5-m15-is-2026h1-full-universe-v2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern universe.npz --pattern manifest.json \
            --dir reports/m5-upstream-is --clobber
          python -m scripts.build_m5_full_is_universe --verify-only \
            --golden reports/m5-is-canonical/a.npz \
            --golden-manifest reports/m5-is-canonical/a.json
      - name: Download this asset's independent GARCH M5/M15 universe
        if: matrix.symbol != 'EURUSD'
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR: ${{ matrix.symbol }}
        run: |
          slug="$(echo "$PAIR" | tr '[:upper:]' '[:lower:]')"
          mkdir -p reports/pr41-local-source
          gh release download "data-pr40-${slug}-m5-m15-garch-universe-2026h1-v1" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern universe.npz --pattern manifest.json \
            --dir reports/pr41-local-source --clobber
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Recover ORIGINAL frozen trade economics, not model weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Execute exactly 20 genetic generations on native M5/M15/GARCH
        env:
          PAIR: ${{ matrix.symbol }}
          SEED: ${{ matrix.seed }}
        run: |
          archive="reports/pr41-local-source/universe.npz"
          manifest="reports/pr41-local-source/manifest.json"
          if [ "$PAIR" = "EURUSD" ]; then
            archive="reports/m5-upstream-is/universe.npz"
            manifest="reports/m5-upstream-is/manifest.json"
          fi
          python -m scripts.run_pr41_native_asset_evolution \
            --symbol "$PAIR" --seed "$SEED" \
            --universe "$archive" --manifest "$manifest" \
            --eur-universe reports/m5-upstream-is/universe.npz \
            --eur-manifest reports/m5-upstream-is/manifest.json \
            --golden reports/m5-is-canonical/a.npz \
            --golden-manifest reports/m5-is-canonical/a.json
      - name: Verify 20 generations and Q1/Q2 IS metric integrity
        env:
          PAIR: ${{ matrix.symbol }}
          SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(f"reports/pr41-independent-assets/{os.environ['PAIR'].lower()}-seed-{os.environ['SEED']}.json")
          d=json.loads(p.read_text())
          assert d['protocol']=='PR41_native_asset_genetic_20x128_M5M15_IS_v1'
          assert d['symbol']==os.environ['PAIR'] and d['seed']==int(os.environ['SEED'])
          assert (d['generations'],d['population'],d['evaluations'])==(20,128,2560)
          assert [x['generation'] for x in d['history']]==list(range(1,21))
          assert not d['oos_q3_accessed'] and not d['raw_m1_signal_features']
          assert d['independent_from_other_pairs'] and not d['euro_legacy_direction_weights_used']
          c=d['champion']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write(f"## PR41 Independent 20 generations: {d['symbol']} seed {d['seed']}\n\n")
            f.write(f"Gen {d['champion_generation']}; PF Q1={c['pf_q1']}, PF Q2={c['pf_q2']}; "
                    f"executed {c['executed_hourly']:.4f}/h; DD H1={c['dd_semester_pct']:.2f}%; "
                    f"qualified={c['qualified']}; GARCH-band "
                    f"[{c['garch_lower']:.3f},{c['garch_upper']:.3f}].\n\n")
            f.write("Only Q1/Q2 IS. Q3 untouched. No promotion.\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr41-native-${{ matrix.symbol }}-seed-${{ matrix.seed }}
          path: reports/pr41-independent-assets/*.json
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Independent 4-asset 3-seed selection — no posthoc cherry-picking
    needs: evolution
    runs-on: ubuntu-latest
    outputs:
      eligible_count: ${{ steps.summarize.outputs.eligible_count }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pr41-native-*
          path: reports/pr41-seed-results
      - name: Produce exact 12 result rows and conservative asset-selection gate
        id: summarize
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          files=sorted(Path("reports/pr41-seed-results").rglob("*-seed-*.json"))
          studies=[json.loads(path.read_text()) for path in files]
          symbols=['EURUSD','GBPUSD','AUDUSD','USDCAD']
          seeds=[42,43,44]
          assert len(studies)==12, (len(studies),files)
          assert {(r['symbol'],r['seed']) for r in studies}=={
            (sym,seed) for sym in symbols for seed in seeds
          }
          assert all(r['evaluations']==2560 and r['generations']==20
               and not r['oos_q3_accessed'] and
               not r['raw_m1_signal_features'] for r in studies)
          input_provenance={}
          eligible=[]
          rows=[]
          for sym in symbols:
            group=sorted([r for r in studies if r['symbol']==sym],key=lambda r:r['seed'])
            assert len({r['input_universe_sha256'] for r in group})==1
            input_provenance[sym]=group[0]['input_universe_sha256']
            is_eligible=all(r['qualified_standalone'] for r in group)
            if is_eligible:eligible.append(sym)
            for r in group:
              c=r['champion']
              rows.append(dict(
                symbol=sym,seed=r['seed'],local_generation=r['champion_generation'],
                pf_q1=c['pf_q1'],pf_q2=c['pf_q2'],
                executed_hourly=c['executed_hourly'],
                dd_semester_pct=c['dd_semester_pct'],
                pnl_q1=c['pnl_q1'],pnl_q2=c['pnl_q2'],
                stopped_semester=c['stop_semester'],garch_lower=c['garch_lower'],
                garch_upper=c['garch_upper'],standalone_pass=c['qualified'],
                eligible_3seeds=is_eligible,genome_sha256=r['champion_genome_sha256'],
              ))
          result=dict(protocol='PR41_per_asset_native_20x128_three_seeds_v1',
                symbols=symbols,seeds=seeds,
                input_sha256_by_symbol=input_provenance,
                generations_per_seed_per_asset=20,population=128,
                total_genetic_evaluations=30720,
                signal_timeframes=['M5','M15'],oos_q3_accessed=False,
                no_eur_direction_or_entry_copy=True,
                no_automatic_promotion=True,
                individual_filter_pf_both_quarters_gt=1.20,
                individual_filter_dd_h1_lt=15,
                eligible_assets_3seeds=eligible,
                eligible_count=len(eligible),
                portfolio_requires_2_or_more_eligible_assets=True,
                rows=rows,
                caveat='H1 IS selection; do not use Q3 or retrospectively optimize symbol subset. Seed replication is NOT OOS.'
          )
          out=Path("reports/pr41-20gen-summary.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,indent=2,allow_nan=False)+"\n")
          print("PR41_NATIVE_20GEN_SUMMARY "+json.dumps(result,allow_nan=False),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"eligible_count={len(eligible)}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write("## PR41 independent four asset 20×128×3 evolutionary IS experiments\n\n")
            f.write("| Pair | Seed | Gen | PF Q1 | PF Q2 | Real/h | DD H1 | GARCH min/max | Pass |\n")
            f.write("| --- | ---: | ---: | ---: | ---: | ---: | ---: | --- | --- |\n")
            for x in rows:
              f.write(f"| {x['symbol']} | {x['seed']} | {x['local_generation']} | "
                f"{x['pf_q1'] if x['pf_q1'] is not None else '—'} | "
                f"{x['pf_q2'] if x['pf_q2'] is not None else '—'} | "
                f"{x['executed_hourly']:.4f} | {x['dd_semester_pct']:.2f}% | "
                f"{x['garch_lower']:.3f}/{x['garch_upper']:.3f} | {x['standalone_pass']} |\n")
            f.write(f"\n**Three-seed eligible: {eligible or 'NONE'}**. "
              "Only signed per-pair IS; Q3 untouched. No automatic promotion.\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pr41-independent-20gen-summary
          path: reports/pr41-20gen-summary.json
          if-no-files-found: error
          retention-days: 90
