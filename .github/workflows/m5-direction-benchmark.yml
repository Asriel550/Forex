name: Benchmark supervisado de dirección Scalping M5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: '42'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v6
        with:
          path: data/histdata_scalping
          key: histdata-scalping-2025-${{ hashFiles('datasets/eurusd/manifest.json') }}
      - name: Fit on 2025 and compare on pre-holdout 2026
        run: python -m scripts.run_m5_direction_benchmark
      - uses: actions/upload-artifact@v7
        with:
          name: m5-direction-benchmark
          path: reports/direction-benchmark/benchmark.json
          if-no-files-found: error
