name: PR34 feeds IS congelados y fitness calibrado

on:
  push:
    branches:
      - codex/m5-repro-fitness-calibration-pr34
  workflow_dispatch:
    inputs:
      generations:
        description: 'Gen 376–396 solo con snapshot auditado'
        type: choice
        options: ['1', '5', '21']
        default: '1'
      research_scope:
        description: 'Una semilla p80 o nueve replicas'
        type: choice
        options: ['smoke', 'full']
        default: 'smoke'

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  audit:
    name: Validar feeds sellados en runner ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned numerical runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Unit tests
        run: python -m pytest -q tests/test_m5_repro_fitness_calibration.py tests/test_m5_temporal_evolution.py tests/test_m5_semester_replay.py
      - name: Download single canonical IS features snapshot (Gen 375, March 2859)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13639251699
          run-id: 42535814697
          github-token: ${{ github.token }}
          path: reports/m5-is-canonical
          merge-multiple: true
      - name: Verify raw M1 ZIPs and complete M5 bars without GARCH refitting
        run: |
          python -m scripts.m5_is_repro_audit source \
            --snapshot reports/m5-is-canonical/a.npz \
            --manifest reports/m5-is-canonical/a.json \
            --report reports/m5-is-audit/${{ matrix.replica }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m5-verified-source-${{ matrix.replica }}
          path: reports/m5-is-audit/*.json
          if-no-files-found: warn
          retention-days: 90

  evolve-after-audit:
    name: Compare independent feeds then run the calibrated smoke
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned numerical runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Obtain two independent source verification reports
        uses: actions/download-artifact@v8
        with:
          pattern: m5-verified-source-*
          path: reports/m5-is-audit
          merge-multiple: true
      - name: Fail if M1/M5 SHA256 differs across runners or from canonical
        run: |
          python -m scripts.m5_is_repro_audit compare-sources \
            --first reports/m5-is-audit/a.json \
            --second reports/m5-is-audit/b.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13639251699
          run-id: 42535814697
          github-token: ${{ github.token }}
          path: reports/m5-is-canonical
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Restore Gen 354 and exact March snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Evolution over sealed features only (never access Q3)
        env:
          GENERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.generations || '1' }}
          RESEARCH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.research_scope || 'smoke' }}
        run: |
          if [ "$RESEARCH_SCOPE" = full ]; then
            python -m scripts.run_m5_temporal_evolution \
              --generations "$GENERATIONS" --seeds 42 43 44 \
              --percentiles 0.85 0.80 0.75 \
              --snapshot reports/m5-is-canonical/a.npz \
              --snapshot-manifest reports/m5-is-canonical/a.json
          else
            python -m scripts.run_m5_temporal_evolution \
              --generations "$GENERATIONS" --seeds 43 --percentiles 0.80 \
              --snapshot reports/m5-is-canonical/a.npz \
              --snapshot-manifest reports/m5-is-canonical/a.json
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m5-repro-calibrated-${{ github.run_id }}
          path: |
            reports/m5-is-audit/*.json
            reports/m5-temporal-evolution/*.json
          if-no-files-found: warn
          retention-days: 90
