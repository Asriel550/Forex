name: PR34 audit IS independiente y fitness calibrado

on:
  push:
    branches:
      - codex/m5-repro-fitness-calibration-pr34
  workflow_dispatch:
    inputs:
      generations:
        description: 'Solo tras auditar ambos snapshots. 21 = Gen 376–396.'
        type: choice
        options: ['1', '5', '21']
        default: '1'
      research_scope:
        description: 'Smoke 43/p80 o exploración completa 3 semillas x 3 percentiles'
        type: choice
        options: ['smoke', 'full']
        default: 'smoke'

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  audit:
    name: Reconstrucción fresca ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Pin numerical dependencies and install
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Audit and calibration unit tests
        run: python -m pytest -q tests/test_m5_repro_fitness_calibration.py tests/test_m5_temporal_evolution.py tests/test_m5_semester_replay.py
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Restore canonical March and Gen 354/43
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Fresh IS build with sealed M1, M5, GARCH and March admissions
        run: |
          python -m scripts.m5_is_repro_audit build \
            --snapshot reports/m5-is-audit/${{ matrix.replica }}.npz \
            --manifest reports/m5-is-audit/${{ matrix.replica }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m5-is-rebuild-${{ matrix.replica }}
          path: reports/m5-is-audit/*
          if-no-files-found: warn
          retention-days: 90

  evolve-after-audit:
    name: Compare two builds then smoke or evolve
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Pin numerical dependencies and install
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Download independent, fresh build snapshots
        uses: actions/download-artifact@v8
        with:
          pattern: m5-is-rebuild-*
          path: reports/m5-is-audit
          merge-multiple: true
      - name: Require identical bytes and all source/model fingerprints
        run: |
          python -m scripts.m5_is_repro_audit compare \
            --first reports/m5-is-audit/a.json \
            --second reports/m5-is-audit/b.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Restore canonical March and Gen 354/43
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Evolve from immutable audited IS (NO Q3)
        env:
          GENERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.generations || '1' }}
          RESEARCH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.research_scope || 'smoke' }}
        run: |
          if [ "$RESEARCH_SCOPE" = 'full' ]; then
            python -m scripts.run_m5_temporal_evolution \
              --generations "$GENERATIONS" --seeds 42 43 44 \
              --percentiles 0.85 0.80 0.75 \
              --snapshot reports/m5-is-audit/a.npz \
              --snapshot-manifest reports/m5-is-audit/a.json
          else
            python -m scripts.run_m5_temporal_evolution \
              --generations "$GENERATIONS" --seeds 43 --percentiles 0.80 \
              --snapshot reports/m5-is-audit/a.npz \
              --snapshot-manifest reports/m5-is-audit/a.json
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m5-repro-fitness-${{ github.run_id }}
          path: |
            reports/m5-is-audit/a.json
            reports/m5-is-audit/b.json
            reports/m5-temporal-evolution/*.json
          if-no-files-found: warn
          retention-days: 90
