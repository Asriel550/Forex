name: Ablación multiescala de dirección Scalping M5
on:
  workflow_dispatch:
  push:
    branches: [codex/m5-multiscale-gen315]
permissions:
  contents: read
jobs:
  multiscale:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: '42'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Evolve nine March replicas and seal the champions
        run: python -m scripts.run_m5_multiscale evolve
      - uses: actions/upload-artifact@v7
        with:
          name: m5-multiscale-march-sealed
          path: |
            reports/direction-multiscale/march.json
            reports/direction-multiscale/champions.json
          if-no-files-found: error
      - name: Replay the three sealed champions on April
        run: python -m scripts.run_m5_multiscale diagnose
      - uses: actions/upload-artifact@v7
        with:
          name: m5-multiscale-april-diagnostic
          path: reports/direction-multiscale/april.json
          if-no-files-found: error
