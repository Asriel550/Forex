name: PR35 snapshot durable y auditoria de triggers M5

on:
  push:
    branches:
      - codex/m5-durable-snapshot-signal-audit-pr35
  workflow_dispatch:

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  publish:
    name: Persistencia privada de GARCH en GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch exact sealed PR34 snapshot once for migration
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13639251699
          run-id: 42535814697
          github-token: ${{ github.token }}
          path: reports/m5-is-source
          merge-multiple: true
      - name: Validate source before durable publication
        run: |
          python -m scripts.verify_m5_durable_snapshot \
            --snapshot reports/m5-is-source/a.npz \
            --manifest reports/m5-is-source/a.json
      - name: Publish once; never overwrite a dataset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-m5-is-2026h1-garch-v1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Pinned data release already exists; original assets unchanged"
          else
            gh release create "$TAG" \
              'reports/m5-is-source/a.npz#m5-is-2026h1-v1.npz' \
              'reports/m5-is-source/a.json#m5-is-2026h1-v1.json' \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Frozen M5 EURUSD 2026H1 GARCH input v1' \
              --notes 'Private research data; Jan-Jun 2026 IS. Exact March mask 2859. No Q3. SHA256 verified on every use. Do not replace assets: create a new versioned release instead.'
          fi
          bash scripts/download_m5_release.sh reports/m5-is-release-proof
          cmp reports/m5-is-source/a.npz reports/m5-is-release-proof/a.npz
          cmp reports/m5-is-source/a.json reports/m5-is-release-proof/a.json
      - name: Verify git commit points to a private repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo view "$GITHUB_REPOSITORY" --json isPrivate \
            --jq '.isPrivate' | grep -qx true
          gh release view data-m5-is-2026h1-garch-v1 \
            --repo "$GITHUB_REPOSITORY" --json tagName,url \
            --jq '{tag:.tagName,url:.url}'

  funnel:
    name: Primary entry and margin trigger funnel (IS only)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Pinned numerical dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Tests and invariant checks
        run: python -m pytest -q tests/test_m5_durable_signal_audit.py tests/test_m5_repro_fitness_calibration.py
      - name: Fetch strictly pinned release, not temporary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download_m5_release.sh reports/m5-is-canonical
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Restore founder seal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Measure entry > 0 and activation margin before gate
        run: |
          python -m scripts.audit_m5_primary_triggers \
            --snapshot reports/m5-is-canonical/a.npz \
            --manifest reports/m5-is-canonical/a.json \
            --output reports/m5-primary-trigger-audit/funnel.json
      - name: Upload funnel diagnostics, even if noncanonical GARCH
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr35-primary-triggers
          path: reports/m5-primary-trigger-audit/*.json
          if-no-files-found: warn
          retention-days: 90
