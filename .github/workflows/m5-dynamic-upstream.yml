name: PR36 upstream evolutivo M5-M15 y replay IS semestral

on:
  push:
    branches:
      - codex/m5-dynamic-upstream-gen376-pr36
  workflow_dispatch:
    inputs:
      generations:
        description: "Solo smoke 1/3/5; sin 21 generaciones hasta aprobar criterios"
        type: choice
        options: ['1', '3', '5']
        default: '1'
      seeds:
        description: "Smoketest o tres semillas"
        type: choice
        options: ['smoke', 'full']
        default: 'smoke'

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  build-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducible numerical environment
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Unit tests for causal upstream and frozen universe
        run: python -m pytest -q tests/test_m5_dynamic_upstream.py tests/test_m5_durable_signal_audit.py tests/test_m5_repro_fitness_calibration.py
      - name: Download immutable PR35 canonical GARCH features
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download_m5_release.sh reports/m5-is-canonical
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Recover canonical March + frozen Gen354 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Reuse immutable M5+M15 universe or migrate from sealed prior v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-m5-m15-is-2026h1-full-universe-v2"
          mkdir -p reports/m5-upstream-is
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Reuse already-sealed M5+M15 features; no GARCH recalculation."
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'universe.npz' --pattern 'manifest.json' \
              --dir reports/m5-upstream-is --clobber
            python -m scripts.build_m5_full_is_universe --verify-only \
              --golden reports/m5-is-canonical/a.npz \
              --golden-manifest reports/m5-is-canonical/a.json
          else
            mkdir -p reports/m5-parent-universe
            gh release download data-m5-is-2026h1-full-universe-v1 \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'universe.npz' --pattern 'manifest.json' \
              --dir reports/m5-parent-universe --clobber
            python -m scripts.build_m5_full_is_universe \
              --golden reports/m5-is-canonical/a.npz \
              --golden-manifest reports/m5-is-canonical/a.json \
              --parent-universe reports/m5-parent-universe/universe.npz \
              --parent-manifest reports/m5-parent-universe/manifest.json
          fi
      - name: Publish M5+M15 v2 once, verify exact bytes on retrieval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-m5-m15-is-2026h1-full-universe-v2"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              reports/m5-upstream-is/universe.npz \
              reports/m5-upstream-is/manifest.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "PR36 frozen EURUSD M5+M15 signals IS 2026 H1" \
              --notes "Corrects withdrawn M1-signal experiment. M1 is used only for M5/M15 OHLCV aggregation; direction and gate frozen; Q3 untouched."
          fi
          mkdir -p reports/m5-upstream-download
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern 'universe.npz' --pattern 'manifest.json' \
             --dir reports/m5-upstream-download --clobber
          cmp reports/m5-upstream-is/universe.npz reports/m5-upstream-download/universe.npz
          cmp reports/m5-upstream-is/manifest.json reports/m5-upstream-download/manifest.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr36-frozen-full-is-universe
          path: |
            reports/m5-upstream-is/universe.npz
            reports/m5-upstream-is/manifest.json
          if-no-files-found: warn
          retention-days: 90

  genetic-replay:
    needs: build-universe
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Download both SHA-pinned full and historical IS releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/download_m5_release.sh reports/m5-is-canonical
          mkdir -p reports/m5-upstream-is
          gh release download data-m5-m15-is-2026h1-full-universe-v2 \
             --repo "$GITHUB_REPOSITORY" --pattern 'universe.npz' \
             --pattern 'manifest.json' --dir reports/m5-upstream-is --clobber
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Restore frozen March founder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Evolve primary entry head and replay exact Gate p85 Q1/Q2
        env:
          GENERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.generations || '1' }}
          SEED_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.seeds || 'smoke' }}
        run: |
          if [ "$SEED_SCOPE" = full ]; then
            python -m scripts.run_m5_dynamic_upstream \
              --universe reports/m5-upstream-is/universe.npz \
              --manifest reports/m5-upstream-is/manifest.json \
              --golden reports/m5-is-canonical/a.npz \
              --golden-manifest reports/m5-is-canonical/a.json \
              --generations "$GENERATIONS" --seeds 42 43 44
          else
            python -m scripts.run_m5_dynamic_upstream \
              --universe reports/m5-upstream-is/universe.npz \
              --manifest reports/m5-upstream-is/manifest.json \
              --golden reports/m5-is-canonical/a.npz \
              --golden-manifest reports/m5-is-canonical/a.json \
              --generations "$GENERATIONS" --seeds 43
          fi
      - name: Publish measured PF / drawdown / frequency; never silently claim success
        if: success()
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('reports/m5-dynamic-upstream/replay.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## PR36 experimental replay, Q1/Q2 IS only\n\n')
            f.write('Target: >=1.2/h executed semester, PF>1.20 both quarters, DD<15%, no account stop.\n\n')
            for x in [('Legacy',d['baseline'])]+[(f"Seed {v['seed']}",v['champion']) for v in d['experiments']]:
              name,v=x
              f.write(f"- {name}: p85, PF Q1/Q2 {v['quarter_pf']}, frequency semester {v['semester_rate']:.3f}/h, DD Q1/Q2 {v['quarter_dd']}, pass={v['qualifies']}\n")
            if not d['all_targets_met']:
              f.write('\n**Research acceptance FAILED.** No head promoted. Gate and Q3 unchanged.\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr36-dynamic-upstream-replay
          path: reports/m5-dynamic-upstream/*.json
          if-no-files-found: warn
          retention-days: 90
