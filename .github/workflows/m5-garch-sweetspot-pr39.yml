name: PR39 GARCH sweet spot A-B-C EURUSD M5-M15 IS

on:
  push:
    branches:
      - codex/m5-garch-sweetspot-pr39
    paths:
      - research/triggers/pr39-garch-sweetspot-v1.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr39-garch-sweetspot-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  a_b_c:
    name: GARCH A+B+C, seed ${{ matrix.seed }}, 12x128 evolution
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned numerical environment
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Tests for M5+M15 causality, regime band and exact original p85
        run: |
          python -m pytest -q tests/test_m5_garch_sweetspot.py tests/test_m5_m15_target_experiments.py tests/test_m5_dynamic_upstream.py tests/test_m5_gate_sensitivity.py
      - name: Download original SHA-pinned GARCH and complete M5+M15 IS universe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/download_m5_release.sh reports/m5-is-canonical
          mkdir -p reports/m5-upstream-is
          gh release download data-m5-m15-is-2026h1-full-universe-v2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern universe.npz --pattern manifest.json \
            --dir reports/m5-upstream-is --clobber
          python -m scripts.build_m5_full_is_universe --verify-only \
            --golden reports/m5-is-canonical/a.npz \
            --golden-manifest reports/m5-is-canonical/a.json
      - name: Fetch PR38 frozen GARCH head for this seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/pr38-founder
          gh run download 42551086458 \
            --repo "$GITHUB_REPOSITORY" \
            --name "pr38-phase3-garch_regime-seed-${{ matrix.seed }}" \
            --dir reports/pr38-founder
          test -s "reports/pr38-founder/garch_regime-seed-${{ matrix.seed }}.json"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Restore unchanged canonical March original founder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Phase A band grid, B 12x128 PF-times-frequency, C local conviction
        run: |
          python -m scripts.run_m5_garch_sweetspot \
            --seed ${{ matrix.seed }} \
            --founder-report "reports/pr38-founder/garch_regime-seed-${{ matrix.seed }}.json" \
            --universe reports/m5-upstream-is/universe.npz \
            --manifest reports/m5-upstream-is/manifest.json \
            --golden reports/m5-is-canonical/a.npz \
            --golden-manifest reports/m5-is-canonical/a.json
      - name: Validate exact A-B-C experiment and write readable per-seed metrics
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(f"reports/m5-garch-sweetspot/seed-{os.environ['SEED']}.json").read_text())
          assert (d['population'],d['genetic_generations'],d['genetic_evaluations'])==(128,12,1536)
          assert d['oos_accessed'] is False and d['signal_timeframes']==['M5','M15']
          assert len(d['phase_A'])==5 and len(d['phase_C'])==4
          assert [r['band']['relaxation'] for r in d['phase_A']]==[0,.075,.15,.225,.30]
          assert [x['generation'] for x in d['phase_B']['generation_history']]==list(range(1,13))
          assert len({x['genome_sha256'] for x in d['phase_A']})==1
          assert len({x['genome_sha256'] for x in d['phase_C']})==1
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write(f"## PR39 sweet spot — seed {d['seed']}\n\n")
            for stage,records in (('A',d['phase_A']),('B',[d['phase_B']]),('C',d['phase_C'])):
              for x in records:
                f.write(f"{stage} {x['variant']}: PF Q1/Q2 {x['pf_q1']:.3f}/{x['pf_q2']:.3f}, "
                        f"executed {x['executed_hourly_semester']:.3f}/h, "
                        f"semester DD {x['dd_semester_pct']:.2f}%, "
                        f"qualified={x['qualifies']}\n\n")
            f.write("Q3 untouched; no automatic promotion.\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr39-garch-sweetspot-seed-${{ matrix.seed }}
          path: reports/m5-garch-sweetspot/seed-*.json
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Consolidate 3 seeds, A band grid, B fitness and C gates
    needs: a_b_c
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pr39-garch-sweetspot-seed-*
          path: reports/pr39-seeds
      - name: Verify consistent cross-seed variant before claiming success
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          files=sorted(Path("reports/pr39-seeds").rglob("seed-*.json"))
          assert len(files)==3,files
          data=[json.loads(p.read_text()) for p in files]
          assert sorted(x['seed'] for x in data)==[42,43,44]
          assert all(x['oos_accessed'] is False and x['genetic_evaluations']==1536 for x in data)
          assert len({x['universe_sha256'] for x in data})==1
          allrows=[]
          for d in data:
            for stage,rows in (('A',d['phase_A']),('B',[d['phase_B']]),('C',d['phase_C'])):
              for x in rows:
                allrows.append(dict(
                  stage=stage,variant=x['variant'],seed=x['seed'],generation=x['generation'],
                  band_lower=x['band']['applied_low'],band_upper=x['band']['applied_high'],
                  band_relaxation=x['band']['relaxation'],
                  pf_q1=x['pf_q1'],pf_q2=x['pf_q2'],
                  executed_hourly=x['executed_hourly_semester'],
                  dd_semester_pct=x['dd_semester_pct'],
                  qualifies=x['qualifies'],
                  pf_x_frequency=x['pf_frequency_product']
                ))
          passing=[]
          for variant in sorted(set(x['variant'] for x in allrows)):
            samples=[x for x in allrows if x['variant']==variant]
            assert len(samples)==3 and sorted(s['seed'] for s in samples)==[42,43,44]
            if all(x['qualifies'] for x in samples):
              passing.append(variant)
          summary=dict(
            protocol='PR39_GARCH_sweetspot_consolidated_v1',
            signal_timeframes=['M5','M15'],q1_q2_in_sample=True,
            q3_accessed=False,seeds=[42,43,44],
            generation_count_per_seed=12,population=128,genetic_evaluations=4608,
            goal=dict(pf_q1_q2_gt=1.2,executed_hourly_ge=.5,dd_semester_lt=12.,
                      same_variant_all_seeds=True),
            any_fully_qualified=bool(passing),qualified_variants=passing,
            results=allrows,
            interpretation='Improvements in H1 IS do not prove out-of-sample alpha; Q3 is quarantined.',
            automatic_promotion=False,
          )
          Path("reports/pr39-summary.json").write_text(json.dumps(summary,indent=2,allow_nan=False)+"\n")
          print('PR39_SWEETSPOT_FINAL '+json.dumps(summary,allow_nan=False),flush=True)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write("## PR39 — A/B/C research on frozen EURUSD M5+M15 IS\n\n")
            f.write("| Fase | Variante | Seed | PF Q1 | PF Q2 | Ejecutada/h | DD semestral | Apta |\n")
            f.write("| --- | --- | ---: | ---: | ---: | ---: | ---: | --- |\n")
            for x in allrows:
              f.write(f"| {x['stage']} | {x['variant']} | {x['seed']} | "
                      f"{x['pf_q1']:.3f} | {x['pf_q2']:.3f} | "
                      f"{x['executed_hourly']:.3f} | {x['dd_semester_pct']:.2f}% | "
                      f"{'yes' if x['qualifies'] else 'no'} |\n")
            f.write(f"\n**All 3 seeds jointly qualify: {passing or 'NONE'}.** "
                    "Q3 untouched. No automatic promotion.\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pr39-garch-sweetspot-final
          path: reports/pr39-summary.json
          if-no-files-found: error
          retention-days: 90
