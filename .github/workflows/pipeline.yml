name: Forex M15 research and Telegram

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'train para PPO, evolution para genética Scalping M5, diagnostics para protocolo PR8'
        type: choice
        options: [alerts, train, evolution, diagnostics, telegram_test]
        default: alerts
      population_size:
        description: 'evolution: individuos por generación (entero de 4 a 128)'
        type: number
        default: 128
      generations:
        description: 'evolution: ciclos después de la población inicial (entero de 1 a 20)'
        type: number
        default: 10
      confidence_threshold:
        description: 'Umbral nominal; auto aplica el perfil'
        type: choice
        options: [auto, '0.52', '0.53', '0.54', '0.57', '0.58', '0.60', '0.62', '0.63', '0.65']
        default: auto
      drift_scale:
        description: 'Escala de momentum; auto aplica perfil y timeframe'
        type: choice
        options: [auto, '1.0', '1.5', '1.8', '2.0', '2.2']
        default: auto
      ent_coef:
        description: 'Regularización de entropía PPO para nuevo entrenamiento'
        type: choice
        options: [auto, '0.01', '0.012', '0.02', '0.03']
        default: auto
      blocked_penalty:
        description: 'Coste de reward por intento bloqueado'
        type: choice
        options: ['0.02', '0.05', '0.10', '0.25']
        default: '0.05'
      neutral_opportunity_penalty:
        description: 'Coste por esperar SOLO si existe setup que pasa filtros'
        type: choice
        options: [auto, '0', '0.005', '0.01', '0.05', '0.10', '0.20']
        default: auto
      trading_profile:
        description: 'Preset de investigación; auto infiere el perfil por timeframe'
        type: choice
        options: [auto, scalping, intraday, daily, swing]
        default: auto
      timeframe:
        description: 'auto aplica el perfil; M1/M5 usan un histórico independiente'
        type: choice
        options: [auto, M1, M5, M15, H1, H4]
        default: auto
      trading_mode:
        description: 'Entorno para train v4; alerts conserva el contrato de su bundle'
        type: choice
        options: [binary, forex_spot]
        default: binary
      expiry_candles:
        description: '0 aplica el perfil; entero 1..32 (scalping 1..3, spot 1)'
        type: number
        default: 0
      telegram_test_id:
        description: 'ID estable de prueba: repetirlo NO reenvía sent/pending (1..64 ASCII)'
        type: string
        default: 'connectivity-v1'
  schedule:
    - cron: '15 6 * * 1'
    - cron: '1,16,31,46 * * * *'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '42'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  FOREX_ENT_COEF: ${{ inputs.ent_coef || vars.FOREX_ENT_COEF || 'auto' }}
  FOREX_BLOCKED_PENALTY: ${{ inputs.blocked_penalty || vars.FOREX_BLOCKED_PENALTY || '0.05' }}
  FOREX_NEUTRAL_OPPORTUNITY_PENALTY: ${{ inputs.neutral_opportunity_penalty || vars.FOREX_NEUTRAL_OPPORTUNITY_PENALTY || 'auto' }}
  FOREX_TRADE_PENALTY: ${{ vars.FOREX_TRADE_PENALTY || '0.025' }}
  FOREX_MIN_CONFIDENCE: ${{ inputs.confidence_threshold || vars.FOREX_MIN_CONFIDENCE || 'auto' }}
  FOREX_DRIFT_SCALE: ${{ inputs.drift_scale || vars.FOREX_DRIFT_SCALE || 'auto' }}
  FOREX_TRADING_PROFILE: ${{ inputs.trading_profile || 'auto' }}
  FOREX_TIMEFRAME: ${{ inputs.timeframe || 'auto' }}
  FOREX_TRADING_MODE: ${{ inputs.trading_mode || 'binary' }}
  FOREX_EXPIRY_CANDLES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.expiry_candles) || '0' }}
  FOREX_MARKET_DATA_DIR: ${{ vars.FOREX_MARKET_DATA_DIR || 'datasets/eurusd' }}
  FOREX_INPUT_TIMEFRAME: ${{ vars.FOREX_INPUT_TIMEFRAME || 'auto' }}
  FOREX_SOURCE_TIMEZONE: ${{ vars.FOREX_SOURCE_TIMEZONE || 'EST' }}

jobs:
  unit-tests:
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["train","diagnostics","evolution"]'), inputs.mode)) ||
      (github.event_name == 'schedule' && github.event.schedule == '15 6 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results.xml
          retention-days: 14

  research-pipeline:
    needs: unit-tests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["train","diagnostics","evolution"]'), inputs.mode) &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    concurrency:
      group: forex-research-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Resolve and validate research profile
        env:
          RESEARCH_MODE: ${{ inputs.mode }}
        run: python -m src.trading_profiles
      - name: Cache verified HistData M1 archive
        if: >-
          (inputs.mode == 'train' || inputs.mode == 'evolution') && env.FOREX_TRADING_PROFILE == 'scalping' &&
          ((env.FOREX_TIMEFRAME == 'M1' && vars.FOREX_M1_DATA_DIR == '') ||
          (env.FOREX_TIMEFRAME == 'M5' && vars.FOREX_M5_DATA_DIR == ''))
        uses: actions/cache@v6
        with:
          path: data/histdata_scalping
          key: histdata-scalping-2025-${{ hashFiles('datasets/eurusd/manifest.json') }}
      - name: Read static EURUSD CSV or ZIP files
        timeout-minutes: 20
        env:
          RESEARCH_MODE: ${{ inputs.mode }}
          FOREX_M1_DATA_DIR: ${{ vars.FOREX_M1_DATA_DIR }}
          FOREX_M5_DATA_DIR: ${{ vars.FOREX_M5_DATA_DIR }}
        run: |
          if [ "$RESEARCH_MODE" = diagnostics ]; then
            python -m src.data_loader --input-dir datasets/eurusd --input-timeframe "$FOREX_INPUT_TIMEFRAME" --timezone "$FOREX_SOURCE_TIMEZONE" --closures config/closures.json
          elif [ "$FOREX_TRADING_PROFILE" = scalping ]; then
            if [ "$FOREX_TIMEFRAME" = M1 ]; then
              native_dir="$FOREX_M1_DATA_DIR"
              closures=config/closures_m1.json
            else
              native_dir="$FOREX_M5_DATA_DIR"
              closures=config/closures_m5.json
            fi
            if [ -z "$native_dir" ]; then
              native_dir="data/scalping/$FOREX_TIMEFRAME"
              python scripts/prepare_scalping_data.py --timeframe "$FOREX_TIMEFRAME" --output-dir "$native_dir"
              closures="$native_dir/observed_gaps.json"
            elif [ ! -f "$closures" ]; then
              closures="$RUNNER_TEMP/no-scalping-exclusions.json"
              printf '[]\n' > "$closures"
            fi
            python -m src.data_loader --input-dir "$native_dir" --input-timeframe "$FOREX_TIMEFRAME" --timeframe "$FOREX_TIMEFRAME" --timezone "$FOREX_SOURCE_TIMEZONE" --closures "$closures" --output data/eurusd_market.parquet
          else
            python -m src.data_loader --input-dir "$FOREX_MARKET_DATA_DIR" --input-timeframe "$FOREX_INPUT_TIMEFRAME" --timezone "$FOREX_SOURCE_TIMEZONE" --closures config/closures.json --timeframe "$FOREX_TIMEFRAME" --output data/eurusd_market.parquet
          fi
      - name: Causal quant features and continuation state
        timeout-minutes: 45
        env:
          RESEARCH_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RESEARCH_MODE" = diagnostics ]; then
            python -m src.quant_engine --drop-warmup --seed 42 --drift-scale 1.5
          else
            python -m src.quant_engine --input data/eurusd_market.parquet --output data/eurusd_market_features.parquet --drop-warmup --seed 42 --drift-scale "$FOREX_DRIFT_SCALE" --drift-scale-floor "$FOREX_DRIFT_SCALE_FLOOR" --drift-window "$FOREX_TREND_WINDOW" --drift-noise-z "$FOREX_DRIFT_NOISE_Z" --drift-cap-sigma "$FOREX_DRIFT_CAP_SIGMA" --window "$FOREX_GARCH_WINDOW" --refit-every "$FOREX_REFIT_EVERY" --timeframe "$FOREX_TIMEFRAME" --expiry-candles "$FOREX_EXPIRY_CANDLES"
          fi
      - name: Find archived production bundle for train/validation diagnosis
        if: inputs.mode == 'diagnostics'
        id: diagnostic-bundle
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = context.payload.repository.default_branch;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner, repo, name:'forex-alert-bundle', per_page:100});
            for (const artifact of artifacts.filter(a => !a.expired).sort((a,b)=>b.id-a.id)) {
              if (!artifact.workflow_run || artifact.workflow_run.head_branch !== branch) continue;
              const {data:run} = await github.rest.actions.getWorkflowRun(
                {owner, repo, run_id:artifact.workflow_run.id});
              if (run.conclusion !== 'success' || run.event === 'pull_request' ||
                  run.head_repository?.full_name !== `${owner}/${repo}` ||
                  run.path.split('@')[0] !== '.github/workflows/pipeline.yml') continue;
              core.setOutput('artifact_id',artifact.id);
              core.setOutput('run_id',run.id);
              return;
            }
            core.setFailed('No hay bundle v3 compatible. Train publica investigación v4; restaurar v3 auditado o revisar promoción v4.');
      - uses: actions/download-artifact@v8
        if: inputs.mode == 'diagnostics'
        with:
          artifact-ids: ${{ steps.diagnostic-bundle.outputs.artifact_id }}
          run-id: ${{ steps.diagnostic-bundle.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .diagnostic-bundle
          merge-multiple: true
      - name: Diagnose archived PPO (NO training or holdout)
        if: inputs.mode == 'diagnostics'
        timeout-minutes: 20
        run: python -m src.diagnostics --input .diagnostic-bundle/data/eurusd_m15_features.parquet --model-dir .diagnostic-bundle/models --report-dir reports/diagnostics/active_bundle
      - name: Fixed PR8 multi-seed diagnostics (NO holdout or promotion)
        if: inputs.mode == 'diagnostics'
        timeout-minutes: 240
        run: python -m src.diagnostics --seeds 42 43 44 --total-timesteps 100000
      - name: Train with frozen holdout (NO backtest)
        if: inputs.mode == 'train'
        timeout-minutes: 120
        run: |
          python -m src.train --input data/eurusd_market_features.parquet --output-dir models/research_v4 --trading-profile "$FOREX_TRADING_PROFILE" --timeframe "$FOREX_TIMEFRAME" --trading-mode "$FOREX_TRADING_MODE" --expiry-candles "$FOREX_EXPIRY_CANDLES" --total-timesteps 100000 --seed 42 --min-confidence "$FOREX_MIN_CONFIDENCE" --min-expected-edge "$FOREX_MIN_EXPECTED_EDGE" --mc-z "$FOREX_MC_Z" --ent-coef "$FOREX_ENT_COEF" --blocked-penalty "$FOREX_BLOCKED_PENALTY" --neutral-opportunity-penalty "$FOREX_NEUTRAL_OPPORTUNITY_PENALTY" --trade-penalty "$FOREX_TRADE_PENALTY"
          cat models/research_v4/validation/validation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce Scalping M5 validation gate
        if: >-
          inputs.mode == 'train' && env.FOREX_TRADING_PROFILE == 'scalping' &&
          env.FOREX_TIMEFRAME == 'M5' && env.FOREX_TRADING_MODE == 'binary'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('models/research_v4/training_manifest.json').read_text())
          if manifest.get('validation_gate_passed') is not True:
              raise SystemExit('Scalping M5 rechazado en validación. Consultar el resumen y los reportes.')
          PY
      - name: Publish isolated v4 research bundle (no automatic production promotion)
        if: success() && inputs.mode == 'train'
        uses: actions/upload-artifact@v7
        with:
          name: forex-research-bundle-v4-${{ env.FOREX_TRADING_PROFILE }}-${{ env.FOREX_TIMEFRAME }}-${{ env.FOREX_TRADING_MODE }}-e${{ env.FOREX_EXPIRY_CANDLES }}
          path: |
            models/research_v4/best_ppo_agent.zip
            models/research_v4/normalizer.json
            models/research_v4/training_manifest.json
            data/eurusd_market_features.parquet
          if-no-files-found: error
          retention-days: 30
      - name: Find previous M5 research lineage
        if: inputs.mode == 'evolution'
        id: evolution-parent
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = context.payload.repository.default_branch;
            const candidates = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner, repo, name: 'forex-evolution-lineage-v4', per_page: 100});
            // El checkpoint se publica al completar la evolución, antes del gate.
            // Los IDs de artefacto pueden llegar fuera de orden cronológico.
            const previous = candidates.filter(a => !a.expired && a.workflow_run?.head_branch === branch)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            for (const artifact of previous) {
              const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: artifact.workflow_run.id});
              if (run.event !== 'workflow_dispatch' || run.head_repository?.full_name !== `${owner}/${repo}` ||
                  run.path.split('@')[0] !== '.github/workflows/pipeline.yml') continue;
              core.setOutput('artifact_id', artifact.id);
              core.setOutput('run_id', run.id);
              return;
            }
      - name: Download previous M5 research lineage
        if: inputs.mode == 'evolution' && steps.evolution-parent.outputs.artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.evolution-parent.outputs.artifact_id }}
          run-id: ${{ steps.evolution-parent.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .evolution-parent
          merge-multiple: true
      - name: Evolve isolated M5 population
        if: inputs.mode == 'evolution'
        timeout-minutes: 20
        env:
          EVOLUTION_POPULATION_SIZE: ${{ inputs.population_size }}
          EVOLUTION_GENERATIONS: ${{ inputs.generations }}
          EVOLUTION_PARENT_RUN_ID: ${{ steps.evolution-parent.outputs.run_id }}
        run: |
          seed_args=()
          if [ -n "$EVOLUTION_PARENT_RUN_ID" ]; then
            seed_args=(--seed-bundle .evolution-parent/lineage.zip)
          fi
          python -m src.evolution_engine --input data/eurusd_market_features.parquet --population-size "$EVOLUTION_POPULATION_SIZE" --generations "$EVOLUTION_GENERATIONS" "${seed_args[@]}"
          cat reports/evolution/evolution.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save M5 research lineage
        if: inputs.mode == 'evolution'
        uses: actions/upload-artifact@v7
        with:
          name: forex-evolution-lineage-v4
          path: reports/evolution/lineage.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Enforce evolutionary validation gate
        if: inputs.mode == 'evolution'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/evolution/evolution.json').read_text())
          if report.get('qualified') is not True:
              raise SystemExit('El campeón evolutivo no cumplió el gate de búsqueda y confirmación.')
          PY
      - name: Upload generational research candidates
        if: always() && inputs.mode == 'evolution'
        uses: actions/upload-artifact@v7
        with:
          name: forex-evolution-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/evolution/candidates/bundle_scalping_gen_*.zip
          if-no-files-found: warn
          retention-days: 30
      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forex-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/*.md
            reports/*.json
            reports/*.csv
            reports/*.png
            reports/diagnostics/**/*.json
            reports/diagnostics/**/*.csv
            reports/diagnostics/**/*.md
            reports/evolution/evolution.*
            models/*.json
            models/research_v4/**/*.json
            models/research_v4/**/*.csv
            models/research_v4/**/*.md
            data/scalping/**/*.json
          if-no-files-found: warn
          retention-days: 30

  telegram-alert:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '1,16,31,46 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'alerts' || inputs.mode == 'telegram_test') && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      actions: read
    concurrency:
      group: forex-alert-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install inference dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-alerts.txt
      - name: Find latest successful research bundle on default branch
        if: inputs.mode != 'telegram_test'
        id: bundle
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = context.payload.repository.default_branch;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner, repo, name:'forex-alert-bundle', per_page:100});
            for (const artifact of artifacts.filter(a => !a.expired).sort((a,b)=>b.id-a.id)) {
              if (!artifact.workflow_run || artifact.workflow_run.head_branch !== branch) continue;
              const {data:run} = await github.rest.actions.getWorkflowRun(
                {owner, repo, run_id:artifact.workflow_run.id});
              if (run.conclusion !== 'success' || run.event === 'pull_request' ||
                  run.head_repository?.full_name !== `${owner}/${repo}` ||
                  run.path.split('@')[0] !== '.github/workflows/pipeline.yml') continue;
              core.setOutput('artifact_id',artifact.id);
              core.setOutput('run_id',run.id);
              return;
            }
            core.setFailed('No hay bundle v3 compatible. Train publica investigación v4; restaurar v3 auditado o revisar promoción v4.');
      - uses: actions/download-artifact@v8
        if: inputs.mode != 'telegram_test'
        with:
          artifact-ids: ${{ steps.bundle.outputs.artifact_id }}
          run-id: ${{ steps.bundle.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .
          merge-multiple: true
      - name: Restore alert state and live data cache
        if: inputs.mode != 'telegram_test'
        id: live-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            data/live_m15.parquet
            data/telegram_state.json
          key: telegram-static-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-static-v2-
      - name: Infer closed candle and send Telegram alert
        if: inputs.mode != 'telegram_test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f config/closures.json ]; then
            python -m src.telegram_bot --input-dir datasets/eurusd --input-timeframe "$FOREX_INPUT_TIMEFRAME" --timezone "$FOREX_SOURCE_TIMEZONE" --closures config/closures.json
          else
            python -m src.telegram_bot --input-dir datasets/eurusd --input-timeframe "$FOREX_INPUT_TIMEFRAME" --timezone "$FOREX_SOURCE_TIMEZONE"
          fi
      - name: Persist sent or uncertain delivery state
        if: always() && steps.live-cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            data/live_m15.parquet
            data/telegram_state.json
          key: ${{ steps.live-cache.outputs.cache-primary-key }}

      - name: Restore technical test outbox
        if: inputs.mode == 'telegram_test'
        id: test-cache
        uses: actions/cache/restore@v6
        with:
          path: data/telegram_tests
          key: telegram-test-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-test-v1-
      - name: Send technical message (no market data or model required)
        if: inputs.mode == 'telegram_test' && steps.test-cache.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST_ID: ${{ inputs.telegram_test_id }}
        run: python -m src.telegram_bot --test-delivery --test-id "$TELEGRAM_TEST_ID"
      - name: Persist technical test sent or uncertain outbox
        if: always() && inputs.mode == 'telegram_test' && steps.test-cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: data/telegram_tests
          key: ${{ steps.test-cache.outputs.cache-primary-key }}
