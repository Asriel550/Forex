name: Gen 376+ robustez temporal Q1-Q2

on:
  push:
    branches:
      - codex/m5-temporal-fitness-gen376
  workflow_dispatch:
    inputs:
      generations:
        description: "Generaciones desde 376; 21 produce hasta Gen 396"
        type: choice
        options:
          - '1'
          - '5'
          - '21'
        default: '21'
      research_scope:
        description: "Smoke de 1 semilla y p80 o 9 replicas completas"
        type: choice
        options:
          - full
          - smoke
        default: full

permissions:
  contents: read
  actions: read

jobs:
  evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducible CPU environment
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Unit tests for temporal fitness and causal gate
        run: python -m pytest -q tests/test_m5_temporal_evolution.py tests/test_m5_semester_replay.py
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/adaptive-source
          merge-multiple: true
      - name: Restore Gen 354 sealed parent and canonical March
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13631151337/zip" \
            -o "$RUNNER_TEMP/march.zip"
          unzip -p "$RUNNER_TEMP/march.zip" march-inputs.npz > data/adaptive-source/march-inputs.npz
          unzip -p "$RUNNER_TEMP/march.zip" extension.json > data/adaptive-source/extension.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13634275350
          run-id: 42521754798
          github-token: ${{ github.token }}
          path: reports/m5-conviction-evolution
          merge-multiple: true
      - name: Evolve on Q1+Q2 IS; never request Q3
        env:
          GENERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.generations || '1' }}
          RESEARCH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.research_scope || 'smoke' }}
        run: |
          if [ "$RESEARCH_SCOPE" = full ]; then
            python -m scripts.run_m5_temporal_evolution --generations "$GENERATIONS" \
              --seeds 42 43 44 --percentiles 0.85 0.80 0.75
          else
            python -m scripts.run_m5_temporal_evolution --generations "$GENERATIONS" \
              --seeds 43 --percentiles 0.80
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: m5-gen376-temporal-is-${{ github.run_id }}
          path: reports/m5-temporal-evolution/*.json
          if-no-files-found: error
          retention-days: 90
