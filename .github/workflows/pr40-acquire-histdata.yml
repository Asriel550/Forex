name: PR40 — Acquire real HistData GBP AUD CAD Jan-Jun 2026, seal M5 and M15

# Never request July-September 2026 archives. The code whitelists six months.
on:
  push:
    branches:
      - codex/m5-m15-multiasset-pr40
    paths:
      - research/triggers/pr40-histdata-v*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pr40-histdata-2026h1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  acquire:
    name: Download 2026 Jan-Jun HistData for ${{ matrix.symbol }} and seal M5 M15
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [GBPUSD, AUDUSD, USDCAD]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fixed research runtime and requests
        run: |
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Check strict 18-month whitelist across 3 symbols, no Q3 or M1 trading signals
        run: |
          python -m pytest -q tests/test_pr40_histdata_acquisition.py
      - name: Acquire official HistData 6 monthly Generic ASCII ZIPs and aggregate full M5/M15
        run: |
          python -m scripts.acquire_pr40_histdata --symbol ${{ matrix.symbol }} \
            --raw-dir reports/pr40-histdata-raw \
            --output-dir reports/pr40-histdata/${{ matrix.symbol }}
      - name: Record source and derived candle fingerprints, bar count and timeframe
        env:
          PAIR: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from src.artifacts import file_sha256
          symbol=os.environ["PAIR"]
          base=Path("reports/pr40-histdata")/symbol
          meta=json.loads((base/"manifest.json").read_text())
          source=json.loads((base/"source-manifest.json").read_text())
          assert meta["symbol"]==symbol and source["symbol"]==symbol
          assert meta["schema"]=="pr40_histdata_m5_m15_h1_ohlcv_v1"
          assert meta["output_timeframes"]==["M5","M15"]
          assert meta["signal_timeframes"]==["M5","M15"]
          assert meta["m1_trading_features"] is False and meta["q3_accessed"] is False
          assert source["q3_used_for_training_or_signals"] is False
          assert [x["period"] for x in source["sources"]]==[
            f"2026{month:02d}" for month in range(1,7)
          ]
          assert meta["ohlcv_sha256"]==file_sha256(base/"ohlcv.npz")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
            f.write(f"## HistData {symbol}, H1 2026 only\n\n")
            f.write(f"Source: six official monthly ZIPs, fixed EST UTC-05. "
                    f"M1 **only for aggregation**, M5/M15 decision candles.\n\n")
            f.write(f"M5 bars {meta['m5_rows']}, M15 bars {meta['m15_rows']}; "
                    f"derived OHLC SHA256 {meta['ohlcv_sha256']}.\n\n")
            f.write(f"June UTC rows removed at 2026-07-01: "
                    f"{meta['q3_source_rows_rejected']}, "
                    "not used for features/training/replay. No Q3 dataset loaded.\n")
          PY
      - name: Publish durable per-pair sealed H1 candles Release, or verify retry matches
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          tag="data-pr40-$(echo "$PAIR" | tr '[:upper:]' '[:lower:]')-m5-m15-2026h1-v1"
          source="reports/pr40-histdata/$PAIR"
          mkdir -p "$RUNNER_TEMP/pinned"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing Release, verify identical bytes before proceeding"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern ohlcv.npz --pattern manifest.json \
              --pattern source-manifest.json \
              --dir "$RUNNER_TEMP/pinned" --clobber
            for asset in ohlcv.npz manifest.json source-manifest.json; do
              cmp "$source/$asset" "$RUNNER_TEMP/pinned/$asset"
            done
          else
            gh release create "$tag" \
              "$source/ohlcv.npz" "$source/manifest.json" \
              "$source/source-manifest.json" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "PR40 verified HistData $PAIR H1 2026 M5/M15 OHLC" \
              --notes "Sources: six HistData official Generic ASCII monthly archives Jan–Jun 2026, with fixed EST timezone, SHA256 in source-manifest. Raw M1 used solely for aggregation of closed M5 and M15; no M1 trading signals. Any UTC >= 2026-07-01 from June local source excluded before candle calculations. No Q3 training or replay. This is a candle archive ONLY: GARCH, transfer inference and portfolio PF/DD remain unmeasured."
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern ohlcv.npz --pattern manifest.json \
              --pattern source-manifest.json \
              --dir "$RUNNER_TEMP/pinned" --clobber
            for asset in ohlcv.npz manifest.json source-manifest.json; do
              cmp "$source/$asset" "$RUNNER_TEMP/pinned/$asset"
            done
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr40-histdata-${{ matrix.symbol }}-manifest-and-bars
          path: |
            reports/pr40-histdata/${{ matrix.symbol }}/ohlcv.npz
            reports/pr40-histdata/${{ matrix.symbol }}/manifest.json
            reports/pr40-histdata/${{ matrix.symbol }}/source-manifest.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr40-histdata-${{ matrix.symbol }}-original-source-zip
          path: reports/pr40-histdata-raw/${{ matrix.symbol }}/*.zip
          if-no-files-found: warn
          retention-days: 90

  consolidate:
    name: Verify all three sources acquired and durable releases published
    needs: acquire
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pr40-histdata-*-manifest-and-bars
          path: reports/pr40-pairs
      - name: "Cross-pair verification: months, Q1/Q2, candles and SHA256"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          metas=[]
          for symbol in ("GBPUSD","AUDUSD","USDCAD"):
            paths=list(Path("reports/pr40-pairs").rglob(f"{symbol}/manifest.json"))
            assert len(paths)==1,(symbol,paths)
            root=paths[0].parent
            d=json.loads((root/"manifest.json").read_text())
            source=json.loads((root/"source-manifest.json").read_text())
            h=sha256((root/"ohlcv.npz").read_bytes()).hexdigest()
            assert d["symbol"]==symbol and h==d["ohlcv_sha256"]
            assert d["q3_accessed"] is False and not d["m1_trading_features"]
            assert d["m5_rows"]>10000 and d["m15_rows"]>5000
            assert source["periods"]==[f"2026{m:02d}" for m in range(1,7)]
            metas.append(dict(symbol=symbol,sha256=h,m5=d["m5_rows"],
                             m15=d["m15_rows"],m5_start=d["m5_start_utc"],
                             m5_last_open=d["m5_last_open_utc"]))
          print("PR40_HISTDATA_ALL_THREE "+json.dumps(metas,allow_nan=False),flush=True)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
            f.write("## All 3 HistData pairs downloaded and aggregated: 2026 H1\n\n")
            for x in metas:
              f.write(f"{x['symbol']}: {x['m5']} M5, {x['m15']} M15; "
                      f"SHA256 {x['sha256']}; 2026 H1 only\n\n")
            f.write("No portfolio PF or frequency inferred; new GARCH/normalization "
                    "universes required for PR38 frozen head before portfolio replay.\n")
          PY
