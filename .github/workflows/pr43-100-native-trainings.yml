name: PR43 — 100 MORE generations from PR42 champion per FX pair (H1 IS ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr43-100-native-trainings-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  continuation:
    name: Continue PR42 ${{ matrix.symbol }} / seed ${{ matrix.seed }} / 100gen
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: [EURUSD, GBPUSD, AUDUSD, USDCAD]
        seed: [42, 43, 44]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install original PR41 environment
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0
          python -m pip check
      - name: Test founder lineage, no zero reset, GARCH independence and Q3 lock
        run: |
          python -m pytest -q tests/test_pr43_100_native_trainings.py tests/test_pr42_isolated_silos.py tests/test_pr41_native_asset_evolution.py
      - name: Download EXACT frozen winning genome for this pair and original seed
        uses: actions/download-artifact@v8
        with:
          name: pr41-native-${{ matrix.symbol }}-seed-${{ matrix.seed }}
          run-id: 42576852134
          github-token: ${{ github.token }}
          path: reports/pr43-pr42-founder
      - name: Fetch only EURUSD sealed H1 M5/M15 GARCH
        if: matrix.symbol == 'EURUSD'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/download_m5_release.sh reports/m5-is-canonical
          mkdir -p reports/pr43-local-source
          gh release download data-m5-m15-is-2026h1-full-universe-v2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern universe.npz --pattern manifest.json \
            --dir reports/pr43-local-source --clobber
      - name: Fetch only THIS non-EUR pair's sealed native H1 M5/M15 GARCH
        if: matrix.symbol != 'EURUSD'
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR: ${{ matrix.symbol }}
        run: |
          slug="$(echo "$PAIR" | tr '[:upper:]' '[:lower:]')"
          mkdir -p reports/pr43-local-source
          gh release download "data-pr40-${slug}-m5-m15-garch-universe-2026h1-v1" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern universe.npz --pattern manifest.json \
            --dir reports/pr43-local-source --clobber
      - name: Continue the original PR42 champion 100 MORE generations (21..120), Q3 LOCKED
        env:
          PAIR: ${{ matrix.symbol }}
          SEED: ${{ matrix.seed }}
        run: |
          slug="$(echo "$PAIR" | tr '[:upper:]' '[:lower:]')"
          extra=()
          if [ "$PAIR" = "EURUSD" ]; then
            extra=(--golden reports/m5-is-canonical/a.npz --golden-manifest reports/m5-is-canonical/a.json)
          fi
          python -m scripts.run_pr43_100_native_trainings \
            --symbol "$PAIR" --seed "$SEED" \
            --report "reports/pr43-pr42-founder/${slug}-seed-${SEED}.json" \
            --universe reports/pr43-local-source/universe.npz \
            --manifest reports/pr43-local-source/manifest.json \
            "${extra[@]}"
      - name: Verify 100 additional generations, original founder SHA and unchanged OOS lock
        env:
          PAIR: ${{ matrix.symbol }}
          SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path('reports/pr43-100-generation-continuations')/
              os.environ['PAIR'].lower()/f"seed-{os.environ['SEED']}.json").read_text())
          assert r['protocol']=='PR43_continue_PR42_champions_100_gen_H1_IS_v1'
          assert r['symbol']==os.environ['PAIR'] and r['seed']==int(os.environ['SEED'])
          assert r['additional_generations']==100 and r['new_evaluations']==12800
          assert r['first_new_generation']==21 and r['last_new_generation']==120
          assert [x['generation'] for x in r['history']]==list(range(21,121))
          assert r['source_pr42_qualified'] is True and r['started_from_champion'] is True
          assert r['zero_initialized'] is False and r['original_models_modified'] is False
          assert r['q3_accessed'] is False and r['oos_evaluated'] is False
          assert r['auto_promoted'] is False and r['shared_account'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write(f"## {r['symbol']} seed {r['seed']} continued 100 generations\n\n")
            f.write(f"Source champ Gen {r['source_pr42_generation']}; "
                    f"new champ Gen {r['evolved_champion_generation']}; 12,800 eval.\n\n")
            f.write(f"PF Q1/Q2 {r['evolved_champion_metrics']['pf_q1']}, "
                    f"{r['evolved_champion_metrics']['pf_q2']}; "
                    f"DD {r['evolved_champion_metrics']['dd_semester_pct']}%; "
                    f"freq {r['evolved_champion_metrics']['executed_hourly']}/h. "
                    "Only H1 IS; Q3 never accessed.\n")
          PY
      - name: Archive distinct original/continued champion genomes for this lineage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr43-continued-${{ matrix.symbol }}-seed-${{ matrix.seed }}
          path: reports/pr43-100-generation-continuations/
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Verify 12 original champion continuations and 153,600 new evaluations
    needs: continuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pr43-continued-*
          path: reports/pr43-collated
      - name: Consolidate only 12 H1 descendants without cherry-picking or Q3
        run: |
          python - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          paths=list(Path('reports/pr43-collated').rglob('seed-*.json'))
          records=[json.loads(p.read_text()) for p in paths]
          symbols=('EURUSD','GBPUSD','AUDUSD','USDCAD')
          seeds=(42,43,44)
          assert len(records)==12 and {(r['symbol'],r['seed']) for r in records}=={
              (sym,seed) for sym in symbols for seed in seeds}
          assert sum(r['new_evaluations'] for r in records)==153600
          for r in records:
            assert r['protocol']=='PR43_continue_PR42_champions_100_gen_H1_IS_v1'
            assert r['additional_generations']==100 and r['population']==128
            assert r['first_new_generation']==21 and r['last_new_generation']==120
            assert len(r['history'])==100 and [x['generation'] for x in r['history']]==list(range(21,121))
            assert r['q3_accessed'] is False and r['oos_evaluated'] is False
            assert r['zero_initialized'] is False and r['started_from_champion'] is True
            assert r['original_models_modified'] is False and r['auto_promoted'] is False
            for genes,digest in ((r['source_pr42_genome'],r['source_pr42_genome_sha256']),
                                 (r['evolved_champion_genome'],r['evolved_champion_sha256'])):
              assert hashlib.sha256(struct.pack('<22d',*genes)).hexdigest()==digest
          rows=[]
          for sym in symbols:
            for r in sorted((x for x in records if x['symbol']==sym),key=lambda v:v['seed']):
              m=r['evolved_champion_metrics']
              rows.append(dict(symbol=sym,seed=r['seed'],
                original_generation=r['source_pr42_generation'],
                evolved_generation=r['evolved_champion_generation'],
                pf_q1=m['pf_q1'],pf_q2=m['pf_q2'],
                dd_semester_pct=m['dd_semester_pct'],
                executed_hourly=m['executed_hourly'],qualified=m['qualified'],
                original_genome_sha256=r['source_pr42_genome_sha256'],
                new_genome_sha256=r['evolved_champion_sha256']))
          result=dict(protocol='PR43_12_champion_extensions_H1_v1',
            completed_lineages=12,new_generations_each=100,
            new_genetic_evaluations=153600,
            original_pr41_champions_unchanged=True,
            q3_accessed=False,auto_promotion=False,
            same_H1_IS_search_not_OOS=True,rows=rows)
          Path('pr43-continued-summary.json').write_text(json.dumps(result,indent=2,allow_nan=False)+'\n')
          print('PR43_FINAL_12_CONTINUATIONS '+json.dumps(result,allow_nan=False),flush=True)
          with Path('summary.md').open('w') as f:
            f.write('## 12 PR42 champions x 100 MORE genetic generations (H1 only)\n\n')
            f.write('| Pair | Seed | Best new Gen | PF Q1 | PF Q2 | DD H1 | Real/h |\n')
            f.write('| --- | ---: | ---: | ---: | ---: | ---: | ---: |\n')
            for row in rows:
              f.write(f"| {row['symbol']} | {row['seed']} | {row['evolved_generation']} | "
                      f"{row['pf_q1']} | {row['pf_q2']} | {row['dd_semester_pct']:.3f}% | "
                      f"{row['executed_hourly']:.4f} |\n")
            f.write('\nNo Q3, no OOS, no automatic promotion.\n')
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: pr43-100-more-generations-summary
          path: pr43-continued-summary.json
          if-no-files-found: error
          retention-days: 90
