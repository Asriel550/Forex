name: Replay operativo Gen 333 y extensión Gen 336–355
on:
  workflow_dispatch:
  push:
    branches: [codex/m5-gen333-operational-extension]
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: '42'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/m5-gen333-source
          merge-multiple: true
      - name: Replay Gen 333 on the two frozen windows
        run: python -m scripts.run_m5_gen333 replay
      - uses: actions/upload-artifact@v7
        with:
          name: m5-gen333-operational-replay
          path: |
            reports/m5-gen333/replay.json
            reports/m5-gen333/replay-admissions.csv
          if-no-files-found: error
      - name: Evolve Gen 336 to 355 on March only
        run: python -m scripts.run_m5_gen333 extend
      - uses: actions/upload-artifact@v7
        with:
          name: m5-gen355-three-seeds
          path: |
            reports/m5-gen333/extension.json
            reports/m5-gen333/march-inputs.npz
          if-no-files-found: error
